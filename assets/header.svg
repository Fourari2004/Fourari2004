<svg width="100%" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b192c"/>
      <stop offset="100%" stop-color="#0a1931"/>
    </linearGradient>

    <!-- Glowing Text & Border Gradient -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <!-- Wave Layer 1 (Deep Blue) -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#2575fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Wave Layer 2 (Cyan Glow) -->
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6a11cb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2575fc" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: 6px;
      fill: #ffffff;
    }
    .sub-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 2px;
      fill: url(#cyber-cyan);
    }
    .status-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #8b949e;
      letter-spacing: 1px;
    }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="260" rx="16" fill="url(#bg-grad)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="150" y1="0" x2="150" y2="260" />
    <line x1="300" y1="0" x2="300" y2="260" />
    <line x1="450" y1="0" x2="450" y2="260" />
    <line x1="600" y1="0" x2="600" y2="260" />
    <line x1="750" y1="0" x2="750" y2="260" />
    <line x1="900" y1="0" x2="900" y2="260" />
    <line x1="1050" y1="0" x2="1050" y2="260" />
  </g>

  <!-- Ambient Wave Layer 1 -->
  <path d="M0 160 C 250 110, 450 210, 700 150 C 950 90, 1100 180, 1200 140 L 1200 260 L 0 260 Z" fill="url(#wave-grad-1)"/>

  <!-- Ambient Wave Layer 2 -->
  <path d="M0 190 C 200 140, 500 230, 800 170 C 1000 130, 1150 200, 1200 180 L 1200 260 L 0 260 Z" fill="url(#wave-grad-2)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="258" rx="15" stroke="url(#cyber-cyan)" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

  <!-- Glowing Accent Dots -->
  <circle cx="40" cy="35" r="4" fill="#00f2fe" filter="url(#neon-glow)"/>
  <circle cx="58" cy="35" r="4" fill="#4facfe"/>
  <circle cx="76" cy="35" r="4" fill="#2575fc"/>

  <!-- Terminal Label -->
  <text x="100" y="39" class="status-text">&gt; root@taha-datacenter ~ system.online</text>

  <!-- Main Headline Title -->
  <text x="600" y="115" text-anchor="middle" class="title-text">TAHA FOURARI</text>

  <!-- Subtitle Tagline -->
  <text x="600" y="160" text-anchor="middle" class="sub-text">⚡ BIG DATA ARCHITECT  |  AI &amp; MACHINE LEARNING ENGINEER</text>

  <!-- Secondary Metadata -->
  <text x="600" y="195" text-anchor="middle" class="status-text">Distributed Systems • Real-Time Pipelines • Deep Learning • Casablanca, MA 🇲🇦</text>
</svg>